name: Build CarHub Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🚀 Build & Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          cd frontend/android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarHub-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK under GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "🚗 CarHub Android APK (Download Latest)"
          body: |
            ## 📱 CarHub Mobile App for Android
            
            Download the official **CarHub Android APK** below and install it directly on your smartphone.
            
            ### 📥 Download:
            - Click on **`app-debug.apk`** under Assets below to download.
            
            ### ⚙️ Installation Instructions:
            1. Download `app-debug.apk` onto your phone.
            2. Open the downloaded file and tap **Install** (Enable *"Install from unknown sources"* if prompted).
            3. Enjoy CarHub natively on your phone!
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
